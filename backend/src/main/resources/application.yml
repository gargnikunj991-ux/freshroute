server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: freshroute-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:freshroutedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true

freshroute:
  economic:
    handling-cost-per-kg: ${FRESHROUTE_HANDLING_COST_PER_KG:0.50}
    disposal-penalty-per-kg: ${FRESHROUTE_DISPOSAL_PENALTY_PER_KG:3.00}
    q10-coefficient: ${FRESHROUTE_Q10_COEFFICIENT:2.2}
    safety-buffer-hours: ${FRESHROUTE_SAFETY_BUFFER_HOURS:12.0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.wildbugs.freshroute: INFO
    org.springframework.web: INFO
